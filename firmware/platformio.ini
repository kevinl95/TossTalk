[env:m5stick-c-plus2]
platform = espressif32 @ 7.0.1
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified @ ^0.2.2
  h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24

[env:m5stick-s3]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified @ ^0.2.2
  h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24